<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="NEXORA logo">
  <!-- Hexagonal frame — structure / architecture -->
  <polygon points="24,8 104,8 120,64 104,120 24,120 8,64"
           fill="none" stroke="#3b82f6" stroke-width="3" rx="4"/>
  <!-- Blueprint grid (subtle) -->
  <g stroke="#475569" stroke-width="1" fill="none">
    <line x1="32" y1="16" x2="32" y2="112"/>
    <line x1="48" y1="16" x2="48" y2="112"/>
    <line x1="64" y1="16" x2="64" y2="112"/>
    <line x1="80" y1="16" x2="80" y2="112"/>
    <line x1="16" y1="32" x2="112" y2="32"/>
    <line x1="16" y1="48" x2="112" y2="48"/>
    <line x1="16" y1="64" x2="112" y2="64"/>
    <line x1="16" y1="80" x2="112" y2="80"/>
    <line x1="16" y1="96" x2="112" y2="96"/>
  </g>
  <!-- AI / blueprint connectivity nodes -->
  <g fill="#64748a">
    <circle cx="40" cy="40" r="4"/>
    <circle cx="64" cy="40" r="4"/>
    <circle cx="88" cy="40" r="4"/>
    <circle cx="40" cy="64" r="4"/>
    <circle cx="64" cy="64" r="4"/>
    <circle cx="88" cy="64" r="4"/>
    <circle cx="40" cy="88" r="4"/>
    <circle cx="64" cy="88" r="4"/>
    <circle cx="88" cy="88" r="4"/>
  </g>
  <!-- Active flow path (blue) — idea → blueprint → verified -->
  <path d="M40 40 L88 40 L88 88 L40 88"
        fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Transformation arc (amber) — continuous evolution -->
  <path d="M40 40 Q64 24 88 40"
        fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Active nodes on flow path -->
  <circle cx="40" cy="40" r="5" fill="#3b82f6"/>
  <circle cx="88" cy="40" r="5" fill="#3b82f6"/>
  <circle cx="88" cy="88" r="5" fill="#3b82f6"/>
  <circle cx="40" cy="88" r="5" fill="#3b82f6"/>
  <!-- Transformation node -->
  <circle cx="88" cy="40" r="6" fill="#f59e0b"/>
  <!-- Center — intelligence core -->
  <circle cx="64" cy="64" r="6" fill="#3b82f6"/>
  <circle cx="64" cy="64" r="3" fill="#ffffff"/>
</svg>
